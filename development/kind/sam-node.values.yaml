# Kind-mesh wiring shared by every sam-node release; stack an example's
# values on top: helm install <name> charts/sam-node -f this-file -f <example>/values.yaml
controlPlaneUrl: http://sam-mesh-control-plane:8080
extraArgs: ["--discovery-interval=200ms"]

# Keep nodes off the router's worker: a pod dialing its own node's
# hostPort 4501 trips kind's portmap hairpin hole and enrollment fails.
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: sam-role
              operator: NotIn
              values: ["control-plane"]
